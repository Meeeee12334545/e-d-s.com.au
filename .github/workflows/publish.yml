# Builds the site on every push to main and publishes it to the gh-pages
# branch, which GitHub Pages serves at www.e-d-s.com.au.
name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # No server on GitHub Pages, so visits go to the analytics server
          # (render.yaml), which also hosts the dashboard at /admin.
          STATIC_HOST: "1"
          ANALYTICS_ENDPOINT: https://analytics.e-d-s.com.au/api/collect
      - name: Publish dist to the gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          # Keeps the custom domain set, since each publish replaces the branch.
          echo "www.e-d-s.com.au" > CNAME
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
